name: Deploy

on:
   push:
      branches:
       - main

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
       - name: checkout code
         uses: actions/checkout@v4

       - name: ssh
         uses: appleboy/ssh-action@v1.0.3
         with:
            host: ${{secrets.SSH_HOST}}
            username: ubuntu
            key: ${{secrets.SSH_KEY}}
            script: |
               cd /home/ubuntu/terminalNews
               git pull
               export NVM_DIR=~/.nvm
               source ~/.nvm/nvm.sh
               node -v
               npm i --omit=dev
               pm2 restart productionServer 
